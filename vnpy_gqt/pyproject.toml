[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gqt-vnpy-research"
version = "0.1.0"
description = "BTC/ETH USDT-M walk-forward research module for GQT using vn.py"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "vnpy>=4.4,<4.5",
  "vnpy_ctastrategy>=1.4.1,<1.5",
  "vnpy_sqlite>=1.1.3,<1.2",
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
]

[project.optional-dependencies]
binance-paper = ["vnpy_binance>=2024.10,<2027"]
test = ["pytest>=8,<9"]

[project.scripts]
gqt-vnpy = "gqt_vnpy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
