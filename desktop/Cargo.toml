[package]
name = "gqt-trader"
version = "0.2.2"
edition = "2024"
description = "Native Binance futures quantitative trading workstation"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
directories = "6.0"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence"] }
hex = "0.4"
hmac = "0.12"
iconflow = { version = "1.0", features = ["pack-lucide"] }
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zeroize = "1.8"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[build-dependencies]
ico = "0.4"
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
